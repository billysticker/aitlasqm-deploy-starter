display_information:
  name: ExampleCo QM SSO
  description: Sign in to the ExampleCo QM portal - replace before install
  background_color: "#1f2937"
oauth_config:
  redirect_urls:
    - https://replace-me-portal.fly.dev/auth/callback
  scopes:
    user:
      - openid
      - profile
      - email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
